
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Runner 3D</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10233f;color:white;
  font-family:system-ui,Arial,sans-serif;
  overflow:hidden;touch-action:none
}
#game{
  display:block;width:100vw;height:100dvh;
  background:#76d9ff;touch-action:none
}
.hud{
  position:fixed;top:14px;left:14px;right:14px;
  display:flex;justify-content:space-between;gap:8px;
  pointer-events:none
}
.pill{
  background:#122a46dd;border:2px solid #ffffff55;
  border-radius:16px;padding:9px 13px;
  font-weight:900;font-size:14px;
  box-shadow:0 4px 0 #07172b55
}
#pause{
  pointer-events:auto;border:0;color:white;
  cursor:pointer;font-size:17px
}
#controls{
  position:fixed;bottom:20px;left:0;right:0;
  display:flex;justify-content:center;gap:14px;
}
.ctrl{
  width:65px;height:60px;border:2px solid #ffffff99;
  border-radius:20px;background:#15385dcc;color:white;
  font-size:25px;font-weight:900;
  box-shadow:0 5px 0 #07172b77;
  touch-action:manipulation
}
.ctrl:active{transform:translateY(4px);box-shadow:none}
.overlay{
  position:fixed;inset:0;display:flex;
  align-items:center;justify-content:center;
  padding:20px;background:#07172b88;
}
.panel{
  width:min(390px,100%);text-align:center;
  padding:26px 22px;border-radius:28px;
  background:linear-gradient(160deg,#2368a7,#122541);
  border:2px solid #ffffff77;
  box-shadow:0 12px 35px #06132988;
}
.logo{font-size:48px;margin-bottom:2px}
h1{font-size:30px;line-height:1.05;margin:8px 0;color:#ffe66d}
p{line-height:1.55;color:#e4f5ff}
.mainbtn{
  width:100%;padding:15px;margin-top:10px;
  border:0;border-radius:16px;background:#ffcf35;
  color:#24334c;font-size:18px;font-weight:1000;
  box-shadow:0 5px 0 #bc8011;cursor:pointer
}
.mainbtn:active{transform:translateY(3px);box-shadow:none}
.small{font-size:12px;color:#c4e6ff}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill">⭐ <span id="score">0</span>
    &nbsp; 🪙 <span id="coins">0</span></div>
  <button id="pause" class="pill">Ⅱ</button>
  <div class="pill">🏆 <span id="best">0</span></div>
</div>

<div id="controls">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="jump">⬆</button>
  <button class="ctrl" id="right">▶</button>
</div>

<div class="overlay" id="startScreen">
  <div class="panel">
    <div class="logo">🏃‍♂️💨</div>
    <h1>SUPER RUNNER<br>3D</h1>
    <p>Lari sejauh mungkin, hindari rintangan, dan kumpulkan koin emas!</p>
    <button class="mainbtn" id="start">▶ MULAI BERMAIN</button>
    <p class="small">Geser layar atau gunakan tombol kontrol.</p>
  </div>
</div>

<div class="overlay hidden" id="endScreen">
  <div class="panel">
    <div class="logo" id="endIcon">💥</div>
    <h1 id="endTitle">GAME OVER!</h1>
    <p>Skor: <b id="finalScore">0</b><br>
       Koin terkumpul: <b id="finalCoins">0</b></p>
    <button class="mainbtn" id="restart">↻ MAIN LAGI</button>
  </div>
</div>

<div class="overlay hidden" id="pauseScreen">
  <div class="panel">
    <div class="logo">⏸️</div>
    <h1>JEDA</h1>
    <p>Istirahat sebentar, pelari!</p>
    <button class="mainbtn" id="resume">LANJUTKAN</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

let W=0,H=0,DPR=1;
function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

let running=false, paused=false, over=false;
let lane=0, jump=0, jumpV=0;
let score=0, coins=0, best=0, speed=.38;
let objects=[], spawn=0, last=0, world=0;
let audio=null;

try{best=Number(localStorage.getItem("sr3best"))||0}catch(e){}
$("best").textContent=best;

function sound(freq=600,duration=.08){
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    const o=audio.createOscillator();
    const g=audio.createGain();
    o.frequency.value=freq;
    o.type="sine";
    g.gain.setValueAtTime(.08,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+duration);
  }catch(e){}
}

function reset(){
  lane=0;jump=0;jumpV=0;
  score=0;coins=0;speed=.38;
  objects=[];spawn=.7;world=0;
  over=false;paused=false;
  $("score").textContent=0;
  $("coins").textContent=0;
}

function startGame(){
  reset();
  running=true;
  $("startScreen").classList.add("hidden");
  $("endScreen").classList.add("hidden");
  $("pauseScreen").classList.add("hidden");
  last=performance.now();
  sound(700,.12);
}
function endGame(){
  running=false;over=true;
  sound(120,.3);
  best=Math.max(best,Math.floor(score));
  try{localStorage.setItem("sr3best",best)}catch(e){}
  $("best").textContent=best;
  $("finalScore").textContent=Math.floor(score);
  $("finalCoins").textContent=coins;
  $("endScreen").classList.remove("hidden");
}
function move(dir){
  if(!running||paused)return;
  lane=Math.max(-1,Math.min(1,lane+dir));
  sound(380,.04);
}
function doJump(){
  if(!running||paused)return;
  if(jump<=0){jumpV=780;sound(520,.08)}
}
$("start").onclick=startGame;
$("restart").onclick=startGame;
$("left").onclick=()=>move(-1);
$("right").onclick=()=>move(1);
$("jump").onclick=doJump;
$("pause").onclick=()=>{
  if(!running)return;
  paused=!paused;
  $("pauseScreen").classList.toggle("hidden",!paused);
  $("pause").textContent=paused?"▶":"Ⅱ";
  if(!paused)last=performance.now();
};
$("resume").onclick=()=>{
  paused=false;last=performance.now();
  $("pauseScreen").classList.add("hidden");
  $("pause").textContent="Ⅱ";
};

let touchX=0,touchY=0;
canvas.addEventListener("pointerdown",e=>{
  touchX=e.clientX;touchY=e.clientY;
});
canvas.addEventListener("pointerup",e=>{
  if(!running||paused)return;
  const dx=e.clientX-touchX,dy=e.clientY-touchY;
  if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy)){
    move(dx>0?1:-1);
  }else if(dy < -25){doJump()}
});

addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp"," ","a","d"].includes(e.key))
    e.preventDefault();
  if(e.key==="ArrowLeft"||e.key==="a")move(-1);
  if(e.key==="ArrowRight"||e.key==="d")move(1);
  if(e.key==="ArrowUp"||e.key===" ")doJump();
  if(e.key==="Escape"&&running)$("pause").click();
});

function poly(points,color){
  ctx.fillStyle=color;ctx.beginPath();
  ctx.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
  ctx.closePath();ctx.fill();
}
function ellipse(x,y,rx,ry,color){
  ctx.fillStyle=color;ctx.beginPath();
  ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);
  ctx.fill();
}
function rect(x,y,w,h,color,r=0){
  ctx.fillStyle=color;
  if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  else ctx.fillRect(x,y,w,h);
}
function line(x1,y1,x2,y2,color,width=2){
  ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function path(x,y,pts,color){
  poly(pts.map(p=>[p[0]+x,p[1]+y]),color);
}
function project(l,z){
  // z=0 horizon, z=1 dekat pemain
  const horizon=H*.31;
  const bottom=H*.88;
  const p=z*z;
  const roadHalf=W*(.07+.42*p);
  const center=W/2+l*roadHalf*.56;
  return {x:center,y:horizon+(bottom-horizon)*z,
    scale:.12+.95*z,half:roadHalf};
}
function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H*.7);
  sky.addColorStop(0,"#46baff");
  sky.addColorStop(1,"#d4f7ff");
  rect(0,0,W,H,sky);

  // Matahari
  ellipse(W*.82,H*.12,32,32,"#fff4a1");
  // Awan
  for(let i=0;i<4;i++){
    const x=((i*W*.32-world*8)%(W+120)+W+120)%(W+120)-40;
    const y=H*(.12+(i%3)*.055);
    ellipse(x,y,30,12,"#ffffffcc");
    ellipse(x+20,y-7,22,15,"#ffffffdd");
    ellipse(x+39,y,26,12,"#ffffffcc");
  }
  // Bukit
  path(0,H*.36,[[0,0],[W*.12,-H*.1],[W*.26,0],
    [W*.42,-H*.13],[W*.57,0],[W*.76,-H*.09],
    [W,0],[W,H*.25],[0,H*.25]],"#76c97c");
  rect(0,H*.4,W,H*.5,"#59c85e");
}
function drawTree(x,y,s){
  ellipse(x,y+4*s,13*s,5*s,"#268747");
  rect(x-3*s,y-24*s,6*s,27*s,"#9a6338",2*s);
  ellipse(x,y-30*s,14*s,17*s,"#179c58");
  ellipse(x-6*s,y-34*s,9*s,11*s,"#35c96c");
}
function drawRoad(){
  const horizon=H*.31,bottom=H*.89;
  poly([[W*.44,horizon],[W*.56,horizon],
    [W*1.04,bottom],[-W*.04,bottom]],"#596879");
  poly([[W*.44,horizon],[W*.46,horizon],
    [W*.09,bottom],[0,bottom]],"#e9f4fb");
  poly([[W*.54,horizon],[W*.56,horizon],
    [W,bottom],[W*.91,bottom]],"#e9f4fb");

  // Garis lajur bergerak mengikuti perspektif
  for(let i=0;i<13;i++){
    let z=((i/13+world*.8)%1);
    const p=project(0,z);
    const next=project(0,Math.min(1,z+.045+.04*z));
    for(const side of [-1,1]){
      const x1=p.x+side*p.half/3;
      const x2=next.x+side*next.half/3;
      rect(x1-1.5*p.scale,p.y,3*p.scale,
        Math.max(1,next.y-p.y), "#e7f4ff");
    }
  }
  // Pohon di pinggir lintasan
  for(let i=0;i<7;i++){
    const z=((i/7+world*.45)%1);
    const y=H*.31+(H*.55)*z;
    const s=.25+z*.95;
    const offset=W*(.11+.17*z);
    drawTree(-offset,y,s);
    drawTree(W+offset,y,s);
  }
}

function drawCoin(o){
  const p=project(o.l,o.z),s=p.scale;
  const bob=Math.sin(world*9+o.phase)*3*s;
  ellipse(p.x,p.y+4*s,13*s,4*s,"#00000033");
  ellipse(p.x,p.y-17*s+bob,10*s,13*s,"#d88900");
  ellipse(p.x,p.y-19*s+bob,9*s,12*s,"#ffdf37");
  ellipse(p.x-2*s,p.y-21*s+bob,3*s,7*s,"#fff5a6");
  ctx.fillStyle="#b97500";
  ctx.font=`bold ${Math.max(8,13*s)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("$",p.x,p.y-14*s+bob);
}
function drawObstacle(o){
  const p=project(o.l,o.z),s=p.scale;
  const x=p.x,y=p.y;
  ellipse(x,y+2*s,22*s,6*s,"#00000033");
  if(o.type===0){
    // Kotak berwarna
    poly([[x-17*s,y-29*s],[x,y-38*s],[x+17*s,y-29*s],
      [x,y-19*s]],"#ffb0ba");
    rect(x-17*s,y-29*s,34*s,25*s,"#fa4e69",3*s);
    poly([[x+17*s,y-29*s],[x,y-19*s],[x,y+1*s],
      [x+17*s,y-9*s]],"#bd2547");
    line(x-9*s,y-23*s,x-9*s,y-10*s,"#ff9cac",3*s);
  }else{
    // Batu kartun
    poly([[x-20*s,y],[x-16*s,y-20*s],[x-4*s,y-29*s],
      [x+13*s,y-24*s],[x+22*s,y-8*s],[x+17*s,y]],
      "#8c98a9");
    poly([[x-16*s,y-20*s],[x-4*s,y-29*s],
      [x+13*s,y-24*s],[x+4*s,y-13*s]],"#c5d0dc");
    ellipse(x+4*s,y-12*s,3*s,3*s,"#657183");
  }
}
function drawPlayer(){
  const p=project(lane,1);
  const x=p.x,y=p.y;
  const s=Math.min(W/390,1.3);
  const lift=jump;
  const yy=y-lift;
  ellipse(x,y+3*s,22*s,7*s,"#143f2d66");

  // Kaki berayun
  const run=running&&!paused?Math.sin(world*20)*7*s:0;
  line(x-7*s,yy-25*s,x-10*s+run,yy-5*s,"#2348a9",8*s);
  line(x+7*s,yy-25*s,x+10*s-run,yy-5*s,"#2348a9",8*s);
  ellipse(x-11*s+run,yy-4*s,8*s,4*s,"#ffce51");
  ellipse(x+11*s-run,yy-4*s,8*s,4*s,"#ffce51");

  // Badan
  rect(x-15*s,yy-57*s,30*s,35*s,"#1679ed",9*s);
  rect(x-12*s,yy-53*s,9*s,26*s,"#53c4ff",4*s);
  // Tangan
  line(x-13*s,yy-49*s,x-22*s-run*.5,yy-34*s,"#f7bd85",7*s);
  line(x+13*s,yy-49*s,x+22*s+run*.5,yy-34*s,"#f7bd85",7*s);

  // Kepala
  ellipse(x,yy-69*s,18*s,19*s,"#f8c794");
  ellipse(x-5*s,yy-71*s,3*s,4*s,"#243c53");
  ellipse(x+5*s,yy-71*s,3*s,4*s,"#243c53");
  line(x-5*s,yy-61*s,x+5*s,yy-61*s,"#b95148",2*s);
  // Rambut
  ellipse(x-7*s,yy-83*s,10*s,7*s,"#583622");
  ellipse(x+2*s,yy-85*s,11*s,7*s,"#583622");
  // Sepatu
  ellipse(x-12*s+run,yy-1*s,9*s,4*s,"#ffcf32");
  ellipse(x+12*s-run,yy-1*s,9*s,4*s,"#ffcf32");
}

function spawnObject(){
  const l=Math.floor(Math.random()*3)-1;
  // Koin lebih sering muncul, rintangan lebih jarang
  const type=Math.random()<.58?"coin":(Math.random()<.5?0:1);
  objects.push({l,z:.02,type,phase:Math.random()*6});
}
function update(dt){
  if(!running||paused)return;
  world+=dt;
  speed=Math.min(.72,speed+dt*.004);
  score+=dt*10;
  $("score").textContent=Math.floor(score);

  if(jump>0||jumpV>0){
    jump+=jumpV*dt;
    jumpV-=1900*dt;
    if(jump<=0){jump=0;jumpV=0}
  }

  spawn-=dt;
  if(spawn<=0){
    spawnObject();
    spawn=Math.max(.42,1.05-Math.min(.5,speed*.65))+Math.random()*.35;
  }

  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.z+=speed*dt;
    if(o.z>.89&&o.z<1.04&&o.l===lane){
      if(o.type==="coin"){
        coins++;score+=25;
        $("coins").textContent=coins;
        sound(880,.06);
        objects.splice(i,1);continue;
      }else if(o.z>.91&&jump<48){
        endGame();return;
      }
    }
    if(o.z>1.12)objects.splice(i,1);
  }
}

function draw(){
  drawBackground();
  drawRoad();
  const sorted=[...objects].sort((a,b)=>a.z-b.z);
  for(const o of sorted){
    if(o.type==="coin")drawCoin(o);
    else drawObstacle(o);
  }
  drawPlayer();

  // Label kecil
  ctx.textAlign="center";
  ctx.font="bold 12px system-ui";
  ctx.fillStyle="#ffffffcc";
  ctx.fillText("SUPER RUNNER",W/2,H*.24);
}
function loop(now){
  const dt=Math.min((now-last)/1000||0,.035);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
last=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
